name: Secure Pipeline Secrets

on:
  push:
    branches:
      - main

jobs:
  secret-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Access GitHub Secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python -c "import os; print('API Key configured successfully' if os.getenv('API_KEY') else 'API Key missing')"